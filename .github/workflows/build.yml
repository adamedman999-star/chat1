name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          unzip -q chat-app.zip
          bash chat-app/ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chat-apk
          path: chat-app/android/app/build/outputs/apk/debug/app-debug.apk
